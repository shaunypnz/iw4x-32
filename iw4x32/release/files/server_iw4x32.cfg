//////////////////////////////////////////////////////////////////////////////////////////////
//  IW4x-32 server settings - up to 32 players (the start script sets sv_maxclients 32).
//  This file lives in your game folder's userraw\ folder; edit it there and restart the server.
//////////////////////////////////////////////////////////////////////////////////////////////

set sv_hostname "^5IW4x-32 ^7| 32-player server"   // the name in the server browser (^1..^9 = colours)
set sv_motd ""                                       // message on the loading screen (empty = default)
set rcon_password ""                                 // remote admin password - set one to use rcon, empty = rcon off
set g_password ""                                    // join password - empty = anyone can join

set sv_securityLevel "23"        // GUID proof-of-work level (IW4x default)
set sv_floodProtect "1"          // chat flood protection
set sv_kickBanTime "3600"        // seconds before a kicked player may rejoin
set sv_pure "0"
set sv_maxPing "0"               // 0 = no ping limit
set sv_voice "1"
set g_inactivity "300"           // kick AFK players after 300 s (0 = never)
set scr_teambalance "1"
set scr_game_allowkillcam "1"
set logfile "1"                  // console_mp.log in the game folder

// Map rotation: the server plays these in order, then starts again ("gametype <mode> map <map>" pairs).
// Modes: war (Team Deathmatch), dom (Domination), sd (Search & Destroy), dm (Free-for-all), koth, sab, ctf, dd
set sv_mapRotation "gametype war map mp_rust gametype dom map mp_terminal gametype war map mp_highrise gametype dom map mp_afghan gametype war map mp_favela gametype war map mp_estate gametype dom map mp_quarry gametype war map mp_rundown gametype war map mp_underpass gametype dom map mp_derail gametype war map mp_boneyard gametype war map mp_subbase gametype dom map mp_brecourt gametype war map mp_invasion gametype war map mp_checkpoint gametype war map mp_nightshift"
