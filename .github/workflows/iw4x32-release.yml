name: IW4x-32 release

# IW4x-32 kit: cut a v* tag (v2.1, v2.2, ...) and this publishes the kit COMMITTED in that tag (IW4x-32.bat,
# IW4x-32.sh, README.txt, files/ with the iw4x.dll that was tested live) as a public GitHub Release:
# IW4x-32-<tag>.zip, the two launcher scripts on their own, latest.json and iw4x.dll.
# The zip, the tag's iw4x32/release/ (what the installed players' auto-update downloads, latest.json's base_url)
# and latest.json are therefore the same bytes. CI still compiles the tagged source first, as a build check -
# a tag whose source does not build is never published.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build release binary
    runs-on: windows-2022
    steps:
      - name: Check out files
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          # NOTE - If LFS ever starts getting used during builds, switch this to true!
          lfs: false

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate project files
        run: tools/premake5 vs2022

      - name: Set up problem matching
        uses: ammaraskar/msvc-problem-matcher@master

      - name: Build Release binaries
        run: msbuild /m /v:minimal /p:Configuration=Release /p:Platform=Win32 build/iw4x.sln

      - name: Upload Release binary
        uses: actions/upload-artifact@v4
        with:
          name: iw4x32-release
          path: |
            build/bin/Win32/Release/iw4x.dll

  release:
    needs:
      - build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the committed kit (hashes, installers, line endings)
        run: python3 iw4x32/tools/check_kit.py

      - name: Release page text (version + the IW4x release it is made for, from latest.json)
        run: |
          IW4X=$(python3 -c "import json; print(json.load(open('latest.json'))['iw4x'])")
          sed -i "s/@VERSION@/${GITHUB_REF_NAME}/g; s/@IW4X@/${IW4X}/g" iw4x32/RELEASE_NOTES.md
          if grep -n "@[A-Z0-9]*@" iw4x32/RELEASE_NOTES.md; then echo "unfilled placeholder"; exit 1; fi

      - name: Version rule (v2.1, v2.2, ... - see iw4x32/tools/next_version.py)
        run: |
          python3 iw4x32/tools/next_version.py --self-test
          python3 -c "import json,sys,re; v=json.load(open('latest.json'))['version']; sys.exit(0 if v=='${GITHUB_REF_NAME}' and re.fullmatch(r'v2\.\d+', v) else 'tag ${GITHUB_REF_NAME} != latest.json version '+v)"

      - name: Pack the kit
        run: |
          mkdir -p stage/IW4x-32
          cp -a iw4x32/release/. stage/IW4x-32/
          # the v2.0 compatibility shims are for v2.0 updaters only (latest.json "legacy"), not for new players
          rm -f stage/IW4x-32/iw4x32_update.ps1 stage/IW4x-32/iw4x32_update.py
          find stage -name __pycache__ -prune -exec rm -rf {} +
          (cd stage && zip -qr "../IW4x-32-${GITHUB_REF_NAME}.zip" IW4x-32)
          cp iw4x32/release/files/iw4x.dll iw4x.dll
          ls -l "IW4x-32-${GITHUB_REF_NAME}.zip" iw4x.dll

      - name: Publish the release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: "IW4x-32 ${{ github.ref_name }} - 32-player IW4x"
          bodyFile: iw4x32/RELEASE_NOTES.md
          # latest.json: what every IW4x-32 launcher reads (releases/latest/download/latest.json); IW4x-32.bat /
          # IW4x-32.sh also work downloaded on their own - they fetch the rest of the release
          artifacts: "IW4x-32-*.zip,iw4x32/release/IW4x-32.bat,iw4x32/release/IW4x-32.sh,latest.json,iw4x.dll,iw4x32/release/files/SHA256SUMS.txt"
          artifactErrorsFailBuild: true
          allowUpdates: true
          draft: false
          makeLatest: true
