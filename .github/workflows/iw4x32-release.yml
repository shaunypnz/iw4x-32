name: IW4x-32 release

# IW4x-32 kit: cut a v* tag (v2.0, v2.1, ...) and this publishes the kit COMMITTED in that tag (client + server
# installers and the iw4x.dll that was tested live) as a public GitHub Release: IW4x-32-<tag>.zip + iw4x.dll.
# The zip, the tag's iw4x32/release/ (what the installed players' auto-update downloads, latest.json's base_url)
# and latest.json are therefore the same bytes. CI still compiles the tagged source first, as a build check -
# a tag whose source does not build is never published.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build release binary
    runs-on: windows-2022
    steps:
      - name: Check out files
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          # NOTE - If LFS ever starts getting used during builds, switch this to true!
          lfs: false

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate project files
        run: tools/premake5 vs2022

      - name: Set up problem matching
        uses: ammaraskar/msvc-problem-matcher@master

      - name: Build Release binaries
        run: msbuild /m /v:minimal /p:Configuration=Release /p:Platform=Win32 build/iw4x.sln

      - name: Upload Release binary
        uses: actions/upload-artifact@v4
        with:
          name: iw4x32-release
          path: |
            build/bin/Win32/Release/iw4x.dll

  release:
    needs:
      - build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the committed kit (hashes, installers, line endings)
        run: python3 iw4x32/tools/check_kit.py

      - name: Pack the kit
        run: |
          mkdir -p stage/IW4x-32
          cp -a iw4x32/release/. stage/IW4x-32/
          find stage -name __pycache__ -prune -exec rm -rf {} +
          (cd stage && zip -qr "../IW4x-32-${GITHUB_REF_NAME}.zip" IW4x-32)
          cp iw4x32/release/files/iw4x.dll iw4x.dll
          ls -l "IW4x-32-${GITHUB_REF_NAME}.zip" iw4x.dll

      - name: Publish the release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: "IW4x-32 ${{ github.ref_name }} - 32-player IW4x"
          bodyFile: iw4x32/RELEASE_NOTES.md
          artifacts: "IW4x-32-*.zip,iw4x.dll,iw4x32/release/SHA256SUMS.txt"
          artifactErrorsFailBuild: true
          allowUpdates: true
          draft: false
          makeLatest: true
